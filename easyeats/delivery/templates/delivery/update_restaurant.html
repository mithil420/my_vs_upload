<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Mate - Update Restaurant</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Georgia, "Times New Roman", serif;

            background-image:
                linear-gradient(
                    rgba(45, 33, 25, 0.65),
                    rgba(45, 33, 25, 0.65)
                ),
                url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 35px;
        }


        /* MAIN CARD */

        .container {

            width: 100%;

            max-width: 900px;

            display: flex;

            background: #fffdf8;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }


        /* LEFT IMAGE */

        .image-section {

            width: 42%;

            min-height: 620px;

            background-image:
                url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5");

            background-size: cover;

            background-position: center;

            position: relative;
        }


        .image-overlay {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    rgba(45, 33, 25, 0.15),
                    rgba(45, 33, 25, 0.75)
                );

            display: flex;

            align-items: flex-end;

            padding: 35px;
        }


        .image-text {

            color: white;
        }


        .image-text h2 {

            font-size: 32px;

            font-weight: normal;

            margin-bottom: 10px;
        }


        .image-text p {

            font-family: Arial, sans-serif;

            font-size: 13px;

            line-height: 1.6;

            color: #eee;
        }


        /* FORM SECTION */

        .form-section {

            width: 58%;

            padding: 50px;
        }


        .brand {

            text-align: center;

            color: #a97935;

            font-size: 17px;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 12px;
        }


        .title {

            text-align: center;

            font-size: 40px;

            font-weight: normal;

            color: #30241d;

            margin-bottom: 10px;
        }


        .line {

            width: 60px;

            height: 2px;

            background: #b08a51;

            margin: 0 auto 15px;
        }


        .subtitle {

            text-align: center;

            color: #776b61;

            font-family: Arial, sans-serif;

            font-size: 14px;

            margin-bottom: 35px;
        }


        /* FORM */

        .form-group {

            margin-bottom: 21px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #3a2d24;

            font-family: Arial, sans-serif;

            font-size: 14px;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d6c8b8;

            border-radius: 5px;

            background: #fff;

            color: #332820;

            font-family: Arial, sans-serif;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }


        input:focus {

            border-color: #a97935;

            box-shadow:
                0 0 0 2px rgba(169, 121, 53, 0.12);
        }


        /* UPDATE BUTTON */

        .update-btn {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 5px;

            background: #4a3222;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }


        .update-btn:hover {

            background: #a97935;
        }


        /* BACK LINK */

        .back-link {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #80643f;

            font-family: Arial, sans-serif;

            font-size: 13px;

            text-decoration: none;
        }


        .back-link:hover {

            color: #a97935;
        }


        /* RESTAURANT ID */

        .restaurant-id {

            text-align: center;

            margin-top: 18px;

            color: #aaa;

            font-family: Arial, sans-serif;

            font-size: 11px;

        }


        /* MOBILE */

        @media (max-width: 750px) {

            body {

                padding: 15px;
            }


            .container {

                flex-direction: column;
            }


            .image-section {

                width: 100%;

                min-height: 230px;

                height: 230px;
            }


            .form-section {

                width: 100%;

                padding: 35px 25px;
            }


            .title {

                font-size: 32px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- LEFT IMAGE -->

        <div class="image-section">

            <div class="image-overlay">

                <div class="image-text">

                    <h2>
                        Meal Mate
                    </h2>

                    <p>
                        Good food deserves a great place.
                        Keep your restaurant information
                        fresh and up to date.
                    </p>

                </div>

            </div>

        </div>


        <!-- RIGHT FORM -->

        <div class="form-section">


            <div class="brand">
                Restaurant Management
            </div>


            <h1 class="title">
                Update Restaurant
            </h1>


            <div class="line"></div>


            <p class="subtitle">
                Update your restaurant information
            </p>


            <form
                action="{% url 'update_restaurant' restaurant.id %}"
                method="POST"
            >

                {% csrf_token %}


                <!-- RESTAURANT NAME -->

                <div class="form-group">

                    <label>
                        Restaurant Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        value="{{ restaurant.name }}"
                        placeholder="Enter restaurant name"
                        required
                    >

                </div>


                <!-- PICTURE -->

                <div class="form-group">

                    <label>
                        Picture URL
                    </label>

                    <input
                        type="url"
                        name="picture"
                        value="{{ restaurant.picture }}"
                        placeholder="Enter restaurant image URL"
                        required
                    >

                </div>


                <!-- CUISINE -->

                <div class="form-group">

                    <label>
                        Cuisine
                    </label>

                    <input
                        type="text"
                        name="cuisine"
                        value="{{ restaurant.cuisine }}"
                        placeholder="Example: Indian, Italian, Chinese"
                        required
                    >

                </div>


                <!-- RATING -->

                <div class="form-group">

                    <label>
                        Rating
                    </label>

                    <input
                        type="number"
                        name="rating"
                        value="{{ restaurant.rating }}"
                        min="0"
                        max="5"
                        step="0.1"
                        placeholder="Enter rating"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="update-btn"
                >
                    Update Restaurant
                </button>


            </form>


            <!-- BACK -->

            <a
                href="{% url 'open_show_restaurant' %}"
                class="back-link"
            >
                ← Back to Restaurants
            </a>


            <div class="restaurant-id">

                Restaurant ID: {{ restaurant.id }}

            </div>


        </div>

    </div>


</body>

</html>
