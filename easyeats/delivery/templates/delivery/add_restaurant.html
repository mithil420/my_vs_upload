<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Mate - Add Restaurant</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)
                ),
                url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;

            display: flex;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }


        /* LEFT IMAGE */

        .image-section {
            width: 40%;

            background-image:
                url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4");

            background-size: cover;

            background-position: center;
        }


        /* RIGHT FORM */

        .form-section {
            width: 60%;

            padding: 50px;
        }

        .logo {
            text-align: center;

            color: #ff5a1f;

            font-size: 38px;

            margin-bottom: 8px;
        }

        .title {
            text-align: center;

            color: #333;

            font-size: 25px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            color: #333;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 14px;

            outline: none;
        }

        input:focus {
            border-color: #ff5a1f;

            box-shadow: 0 0 5px rgba(255, 90, 31, 0.2);
        }


        .add-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 25px;

            background-color: #ff5a1f;

            color: white;

            font-size: 16px;

            cursor: pointer;

            margin-top: 5px;
        }

        .add-btn:hover {
            background-color: #e64a12;
        }


        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #777;

            text-decoration: none;
        }

        .back-link:hover {
            color: #ff5a1f;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .image-section {
                width: 100%;
                height: 220px;
            }

            .form-section {
                width: 100%;
                padding: 35px 30px;
            }

        }

    </style>

</head>


<body>

    <div class="container">


        <!-- RESTAURANT IMAGE -->

        <div class="image-section">
        </div>


        <!-- FORM -->

        <div class="form-section">

            <h1 class="logo">
                Meal Mate 🍽️
            </h1>

            <h2 class="title">
                Add Restaurant
            </h2>

            <p class="subtitle">
                Add a new restaurant to your platform
            </p>


            <form method="POST" action="/add_restaurant">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Restaurant Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter restaurant name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Picture URL
                    </label>

                    <input
                        type="url"
                        name="picture"
                        placeholder="Enter restaurant image URL"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Cuisine
                    </label>

                    <input
                        type="text"
                        name="cuisine"
                        placeholder="Example: Indian, Chinese, Italian"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Rating
                    </label>

                    <input
                        type="number"
                        name="rating"
                        placeholder="Enter rating (0 - 5)"
                        min="0"
                        max="5"
                        step="0.1"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="add-btn"
                >
                    + Add Restaurant
                </button>

            </form>


            <a
                href="/open_show_restaurant"
                class="back-link"
            >
                View Restaurants
            </a>

        </div>

    </div>

</body>

</html>
